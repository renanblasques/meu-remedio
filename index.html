<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF9F6" />
    <meta
      name="description"
      content="Meu Remédio: protótipo para acompanhar horários e registros de doses de medicamentos."
    />
    <title>Meu Remédio</title>
    <link rel="icon" href="assets/images/logo.png" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="js/domain.js"></script>
    <script defer src="js/storage.js"></script>
    <script defer src="js/store.js"></script>
    <script defer src="js/icons.js"></script>
    <script defer src="js/media.js"></script>
    <script defer src="js/ui.js"></script>
    <script defer src="js/screens-patient.js"></script>
    <script defer src="js/screens-caregiver.js"></script>
    <script defer src="js/screens-editor.js"></script>
    <script defer src="js/app.js"></script>
  </head>
  <body>
    <div class="prototype-layout">
      <div class="phone-frame" aria-label="Protótipo Meu Remédio">
        <div id="notices" class="global-notices" aria-live="polite"></div>
        <div id="app">
          <main class="loading"><p>Preparando seu dia…</p></main>
        </div>
      </div>
      <aside id="simulation" class="simulation-panel" aria-labelledby="simulation-title">
        <div class="stack gap-4">
          <p class="eyebrow purple-ink">CONTROLES DO PROTÓTIPO</p>
          <h2 id="simulation-title">Simulação</h2>
        </div>
        <p class="caption">Avance o relógio sem sair da tela atual do aplicativo.</p>
        <div class="simulation-clock" aria-live="polite" aria-atomic="true">
          <time id="simulation-time"></time>
          <p id="simulation-date" class="caption"></p>
        </div>
        <div class="stack simulation-actions">
          <button class="button primary" type="button" data-action="next-time">
            Ir ao próximo horário
          </button>
          <div class="row">
            <button class="button secondary grow" type="button" data-action="advance" data-id="15">
              +15 minutos
            </button>
            <button class="button secondary grow" type="button" data-action="advance" data-id="1">
              +1 minuto
            </button>
          </div>
          <button class="button secondary" type="button" data-action="next-day">
            Avançar para amanhã, 08:00
          </button>
          <button class="button quiet" type="button" data-action="reset">
            Reiniciar demonstração
          </button>
        </div>
        <p class="caption">
          O relógio é manual e os perfis compartilham os dados neste navegador. Alertas e pedidos
          de ajuda são simulados; não há comunicação com outros celulares.
        </p>
      </aside>
    </div>
    <dialog
      id="confirmation"
      aria-labelledby="dialog-title"
      aria-describedby="dialog-description"
    ></dialog>
    <noscript>Ative o JavaScript do navegador para usar o protótipo Meu Remédio.</noscript>
  </body>
</html>
